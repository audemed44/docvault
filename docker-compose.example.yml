# Docvault: Self-hosted home for scanned family documents: iPhone Shortcut uploads, OCR search, private and family libraries.
services:
  docvault:
    image: ghcr.io/audemed44/docvault:latest
    container_name: docvault
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # Optional: openssl rand -hex 32; Foyer's key for the widget and Drop.
      - DOCVAULT_TOKEN=${DOCVAULT_TOKEN}
      - TZ=Asia/Kolkata
      # Optional: Foyer's address, linked from the header.
      # - HOMEPAGE_URL=https://home.example.com
      # Optional: a service that suggests categories and tags (see README).
      # Everything it's sent leaves Docvault, so point it at a local model.
      # - DOCVAULT_CLASSIFIER_URL=http://classifier:8000/classify
    volumes:
      - ./docvault:/data
    ports:
      - "8090:8080"
    # The server idles at ~25 MB. OCR runs tesseract one page at a time at
    # 300 dpi, which peaks around 460 MB for a few seconds per page. For a
    # big import, 3 documents read at once (DOCVAULT_WORKERS=3, or Settings →
    # Processing) with mem_limit: 1536m is ~3x faster.
    mem_limit: 768m
