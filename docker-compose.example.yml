# Docvault: Self-hosted home for scanned family documents: iPhone Shortcut uploads, OCR search, private and family libraries.
services:
  docvault:
    image: ghcr.io/audemed44/docvault:latest
    container_name: docvault
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # openssl rand -hex 32; what you sign in with, and Foyer's widget key.
      - DOCVAULT_TOKEN=${DOCVAULT_TOKEN}
      - TZ=Asia/Kolkata
      # Optional: Foyer's address, linked from the header.
      # - HOMEPAGE_URL=https://home.example.com
    volumes:
      - ./docvault:/data
    ports:
      - "8090:8080"
    mem_limit: 64m
